name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fintech_dashboard
          POSTGRES_USER: fintech_user
          POSTGRES_PASSWORD: local_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: ./backend
        run: ./mvnw clean test
        env:
          TRUELAYER_CLIENT_ID: dummy
          TRUELAYER_CLIENT_SECRET: dummy
          TRUELAYER_REDIRECT_URI: http://localhost:8080/api/auth/callback
